<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    Adaptive favicon: ink on light tab bars, cream on dark ones. The mark is
    free-standing, so without this it would vanish against dark browser chrome.
    Light is the default, so browsers that ignore prefers-color-scheme in
    favicons still get a valid icon.
  -->
  <style>
    .mark { fill: #26251e; }
    @media (prefers-color-scheme: dark) { .mark { fill: #f7f7f4; } }
  </style>
